  <path d="M 425 150 A 190 190 0 0 1 455 230" fill="none" stroke="#0a4b62" stroke-width="28" stroke-linecap="round" />

  <!-- Left Earphone -->
  <rect x="10" y="225" width="54" height="125" rx="27" fill="#0a4b62" />
  <rect x="58" y="240" width="44" height="95" rx="16" fill="#0a4b62" />

  <!-- Right Earphone -->
  <rect x="436" y="225" width="54" height="125" rx="27" fill="#0a4b62" />
  <rect x="398" y="240" width="44" height="95" rx="16" fill="#0a4b62" />

  <!-- Mic Boom Arm -->
  <path d="M 420 380 V 435 Q 420 465 375 465 H 300" fill="none" stroke="#0a4b62" stroke-width="24" stroke-linecap="round" />
  <rect x="210" y="448" width="76" height="34" rx="17" fill="#0a4b62" />

